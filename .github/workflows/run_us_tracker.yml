name: US Stock Data Collector

on:
  schedule:
    # 화, 수, 목, 금, 토요일 한국 시간 아침 5시에 실행 (UTC 기준 월~금 밤 20시)
    - cron: '0 20 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run US Collector
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
        CHANNEL_CHAT_ID: ${{ secrets.CHANNEL_CHAT_ID }}
      run: python us_collector.py

    - name: Commit and Push CSV files
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add *.csv || true
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update stock data [skip ci]" && git push)
